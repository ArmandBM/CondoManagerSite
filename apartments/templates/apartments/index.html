{% extends "apartments/base.html" %}
    {% block body %}
    <div>
        <h1>Welcome, {{ user.username }}!</h1>
    </div>
    <div>
        <h2>What do you want to do today?</h2>
    </div>
    <div>
        <div class="pure-g">
            <div class="pure-u-1-3"><a href="{% url 'packages' %}" class="pure-button">View received packages</a></div>
            <div class="pure-u-1-3"><a href="{% url 'complains' %}" class="pure-button">Log a complain</a></div>
            <div class="pure-u-1-3">
                <form action="{% url 'logout' %}" method="post">
                    {% csrf_token %}
                    <button type="submit" class="pure-button">Logout</button>
                </form>
            </div>
        </div>
    </div>
    {% endblock %}
